<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS2 Trade — Обмен скинами</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #1b1b1b;
            color: #fff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            background: #111;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #f0c040;
        }
        nav {
            display: flex;
            gap: 20px;
            align-items: center;
        }
        nav a {
            color: #ccc;
            text-decoration: none;
            font-size: 16px;
            cursor: pointer;
        }
        nav a:hover { color: #fff; }
        nav a.active {
            color: #f0c040;
            font-weight: bold;
        }
        .btn-steam {
            background: #2a475e;
            color: #fff;
            border: none;
            padding: 10px 18px;
            font-size: 15px;
            cursor: pointer;
            border-radius: 4px;
            text-decoration: none;
            display: inline-block;
        }
        .btn-steam:hover { background: #1b2838; }
        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 20px;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 10px;
            text-align: center;
        }
        .intro {
            color: #aaa;
            text-align: center;
            margin-bottom: 30px;
        }
        .section {
            width: 100%;
            max-width: 900px;
            margin-bottom: 40px;
        }
        .section-title {
            font-size: 22px;
            margin-bottom: 15px;
            border-bottom: 1px solid #333;
            padding-bottom: 5px;
        }
        .btn-action {
            background: #4caf50;
            color: #fff;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 4px;
            margin-bottom: 20px;
            text-decoration: none;
            display: inline-block;
        }
        .btn-action:hover { background: #45a049; }
        .btn-secondary {
            background: #2a475e;
            color: #fff;
            border: none;
            padding: 10px 18px;
            font-size: 15px;
            cursor: pointer;
            border-radius: 4px;
            margin: 5px;
            text-decoration: none;
        }
        .btn-secondary:hover { background: #1b2838; }
        .inventory-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            max-width: 900px;
        }
        .item-card {
            background: #2b2b2b;
            border-radius: 6px;
            padding: 10px;
            width: 120px;
            text-align: center;
            font-size: 14px;
            color: #ccc;
            transition: transform 0.1s;
            cursor: pointer;
            position: relative;
        }
        .item-card:hover { transform: scale(1.05); background: #3a3a3a; }
        .item-card.selected {
            border: 2px solid #4caf50;
            background: #3d4f3d;
        }
        .item-card img {
            width: 80px;
            height: 80px;
            object-fit: contain;
            margin-bottom: 5px;
        }
        .item-name {
            word-wrap: break-word;
            line-height: 1.2em;
            max-height: 2.4em;
            overflow: hidden;
        }
        .item-count { color: #888; font-size: 12px; margin-top: 3px; }
        #inventory-message, #offer-message { color: #ff6b6b; margin-bottom: 20px; }
        .offer-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .offer-card {
            background: #242424;
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }
        .offer-info {
            flex: 1;
            min-width: 200px;
        }
        .offer-items {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }
        .offer-item {
            background: #333;
            border-radius: 4px;
            padding: 5px;
            text-align: center;
            width: 80px;
            font-size: 12px;
        }
        .offer-item img {
            width: 40px;
            height: 40px;
            object-fit: contain;
        }
        .offer-want {
            color: #ccc;
            margin: 5px 0;
        }
        .offer-user {
            color: #aaa;
            font-size: 14px;
        }
        .offer-date {
            color: #666;
            font-size: 12px;
        }
        .search-box {
            margin-bottom: 15px;
            width: 100%;
            max-width: 400px;
        }
        .search-box input {
            width: 100%;
            padding: 10px;
            background: #1b1b1b;
            border: 1px solid #444;
            color: #fff;
            border-radius: 4px;
            font-size: 16px;
        }
        .hidden { display: none; }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #ccc;
        }
        .form-group input[type="text"], .form-group textarea {
            width: 100%;
            padding: 10px;
            background: #1b1b1b;
            border: 1px solid #444;
            color: #fff;
            border-radius: 4px;
            font-size: 16px;
        }
        .form-group textarea { resize: vertical; }
    </style>
</head>
<body>
    <header>
        <div class="logo">CS2 Trade</div>
        <nav>
            <a id="nav-all" href="#" onclick="setFilter('all'); return false;">Главная</a>
            <a id="nav-my" href="#" onclick="setFilter('my'); return false;">Мои обмены</a>
            <a href="/settings">Настройки</a>
            <a class="btn-steam" id="auth-button" href="/auth/steam">Войти через Steam</a>
        </nav>
    </header>
    <div class="container">
        <h1>Обменивайся скинами CS2 напрямую</h1>
        <p class="intro">Без посредников и платёжных систем. Только ты и твой трейд-партнёр.</p>

        <!-- Секция: Мой инвентарь и создание объявления -->
        <div class="section" id="create-offer-section" style="display: none;">
            <div class="section-title">Создать объявление</div>
            <button class="btn-secondary" onclick="toggleInventory()">Показать мой инвентарь</button>
            <div id="inventory-message"></div>
            <div class="inventory-grid" id="inventory-grid"></div>
            <div style="margin-top: 15px;">
                <label for="want">Что хотите получить взамен?</label>
                <input type="text" id="want" placeholder="Например: AWP | Asiimov (Field-Tested)" style="width: 100%; padding: 10px; background: #1b1b1b; border: 1px solid #444; color: #fff; border-radius: 4px;">
            </div>
            <button class="btn-action" onclick="createOffer()" style="margin-top: 10px;">Опубликовать объявление</button>
            <div id="offer-message"></div>
        </div>

        <!-- Секция: Список объявлений -->
        <div class="section">
            <div class="section-title">Объявления об обмене</div>
            <div class="search-box">
                <input type="text" id="search-input" placeholder="Поиск по желаемому предмету..." oninput="applyFilters()">
            </div>
            <div class="offer-list" id="offer-list">
                <div style="color: #888;">Загрузка объявлений...</div>
            </div>
        </div>
    </div>

    <script>
        let myInventory = null;
        let selectedItems = new Set(); // хранит ключи 'classid_instanceid'
        let currentSteamId = null;
        let allOffers = []; // все объявления
        let showMyOffers = false; // фильтр "только мои"

        // Проверка статуса входа (теперь возвращает Promise)
        function checkAuth() {
            return fetch('/api/user')
                .then(r => r.json())
                .then(data => {
                    const authButton = document.getElementById('auth-button');
                    const createSection = document.getElementById('create-offer-section');
                    if (data.steamId) {
                        currentSteamId = data.steamId;
                        authButton.textContent = 'Привет, ' + data.steamId + ' (Выйти)';
                        authButton.href = '/logout';
                        createSection.style.display = 'block';
                    } else {
                        authButton.textContent = 'Войти через Steam';
                        authButton.href = '/auth/steam';
                        createSection.style.display = 'none';
                    }
                })
                .catch(err => {
                    console.error('Ошибка получения статуса:', err);
                });
        }

        // Загрузка инвентаря и отображение с возможностью выбора
        function toggleInventory() {
            const grid = document.getElementById('inventory-grid');
            const message = document.getElementById('inventory-message');
            if (myInventory) {
                grid.innerHTML = '';
                message.textContent = '';
                myInventory = null;
                selectedItems.clear();
                renderInventory();
                return;
            }
            grid.innerHTML = '';
            message.textContent = 'Загрузка...';
            fetch('/api/inventory')
                .then(r => r.json())
                .then(data => {
                    message.textContent = '';
                    if (data.error) {
                        message.textContent = 'Ошибка: ' + data.error;
                        return;
                    }
                    if (!data.assets || data.assets.length === 0) {
                        message.textContent = 'Инвентарь пуст или скрыт.';
                        return;
                    }
                    myInventory = data;
                    renderInventory();
                })
                .catch(err => {
                    message.textContent = 'Ошибка сети: ' + err;
                });
        }

        function renderInventory() {
            const grid = document.getElementById('inventory-grid');
            grid.innerHTML = '';
            if (!myInventory) return;

            const descriptions = {};
            if (myInventory.descriptions) {
                myInventory.descriptions.forEach(desc => {
                    const key = desc.classid + '_' + desc.instanceid;
                    descriptions[key] = desc;
                });
            }

            const items = myInventory.assets.slice(0, 50);
            items.forEach(asset => {
                const key = asset.classid + '_' + asset.instanceid;
                const desc = descriptions[key];
                if (!desc) return;

                const card = document.createElement('div');
                card.className = 'item-card';
                if (selectedItems.has(key)) card.classList.add('selected');

                const img = document.createElement('img');
                img.src = 'https://community.akamai.steamstatic.com/economy/image/' + desc.icon_url;
                img.alt = desc.market_hash_name || 'Скин';
                img.loading = 'lazy';

                const name = document.createElement('div');
                name.className = 'item-name';
                name.textContent = desc.market_hash_name || 'Неизвестный предмет';

                const count = document.createElement('div');
                count.className = 'item-count';
                count.textContent = 'x' + (asset.amount || 1);

                card.appendChild(img);
                card.appendChild(name);
                card.appendChild(count);

                card.addEventListener('click', () => {
                    if (selectedItems.has(key)) {
                        selectedItems.delete(key);
                        card.classList.remove('selected');
                    } else {
                        selectedItems.add(key);
                        card.classList.add('selected');
                    }
                });

                grid.appendChild(card);
            });
        }

        // Создание объявления
        function createOffer() {
            const want = document.getElementById('want').value.trim();
            const message = document.getElementById('offer-message');
            if (!want) {
                message.textContent = 'Укажите, что хотите получить.';
                return;
            }
            if (selectedItems.size === 0) {
                message.textContent = 'Выберите хотя бы один предмет из инвентаря (нажмите на карточку).';
                return;
            }

            const descriptions = {};
            if (myInventory && myInventory.descriptions) {
                myInventory.descriptions.forEach(desc => {
                    const key = desc.classid + '_' + desc.instanceid;
                    descriptions[key] = desc;
                });
            }

            const itemsArray = [];
            selectedItems.forEach(key => {
                const desc = descriptions[key];
                if (desc) {
                    itemsArray.push({
                        classid: desc.classid,
                        instanceid: desc.instanceid,
                        name: desc.market_hash_name || 'Неизвестный предмет',
                        icon_url: desc.icon_url || ''
                    });
                }
            });

            if (itemsArray.length === 0) {
                message.textContent = 'Не удалось получить данные выбранных предметов.';
                return;
            }

            fetch('/api/offers', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ items: itemsArray, want })
            })
            .then(r => r.json())
            .then(data => {
                if (data.error) {
                    message.textContent = 'Ошибка: ' + data.error;
                    return;
                }
                message.textContent = 'Объявление опубликовано!';
                document.getElementById('want').value = '';
                selectedItems.clear();
                renderInventory();
                loadOffers();
            })
            .catch(err => {
                message.textContent = 'Ошибка сети: ' + err;
            });
        }

        // Загрузка объявлений
        function loadOffers() {
            const list = document.getElementById('offer-list');
            list.innerHTML = '<div style="color: #888;">Загрузка объявлений...</div>';
            fetch('/api/offers')
                .then(r => r.json())
                .then(data => {
                    allOffers = data.offers || [];
                    applyFilters();
                })
                .catch(err => {
                    list.innerHTML = '<div style="color: #ff6b6b;">Ошибка загрузки объявлений.</div>';
                });
        }

        // Применение фильтров (поиск + "мои")
        function applyFilters() {
            const query = document.getElementById('search-input').value.toLowerCase().trim();
            let filtered = allOffers;

            if (showMyOffers && currentSteamId) {
                filtered = filtered.filter(offer => offer.steamId === currentSteamId);
            }

            if (query) {
                filtered = filtered.filter(offer => offer.want.toLowerCase().includes(query));
            }

            renderOffers(filtered);
        }

        // Переключение фильтра "мои/все"
        function setFilter(mode) {
            if (mode === 'my') {
                showMyOffers = true;
                document.getElementById('nav-my').classList.add('active');
                document.getElementById('nav-all').classList.remove('active');
            } else {
                showMyOffers = false;
                document.getElementById('nav-all').classList.add('active');
                document.getElementById('nav-my').classList.remove('active');
            }
            applyFilters();
        }

        // Отображение объявлений
        function renderOffers(offersToShow) {
            const list = document.getElementById('offer-list');
            if (offersToShow.length > 0) {
                list.innerHTML = '';
                offersToShow.forEach(offer => {
                    const card = document.createElement('div');
                    card.className = 'offer-card';

                    const info = document.createElement('div');
                    info.className = 'offer-info';
                    info.innerHTML = `
                        <div class="offer-want"><strong>Хочет:</strong> ${escapeHtml(offer.want)}</div>
                        <div class="offer-user">Steam ID: ${escapeHtml(offer.steamId)}</div>
                        <div class="offer-date">${new Date(offer.createdAt).toLocaleString()}</div>
                        <a href="https://steamcommunity.com/profiles/${escapeHtml(offer.steamId)}" target="_blank" class="btn-secondary" style="display: inline-block; margin-top: 5px;">Открыть профиль</a>
                        ${offer.steamId === currentSteamId ? `<button class="btn-secondary" onclick="deleteOffer('${offer.id}')" style="margin-top: 5px;">Удалить</button>` : ''}
                    `;
                    card.appendChild(info);

                    const itemsDiv = document.createElement('div');
                    itemsDiv.className = 'offer-items';
                    offer.items.forEach(item => {
                        const itemDiv = document.createElement('div');
                        itemDiv.className = 'offer-item';
                        const img = document.createElement('img');
                        img.src = 'https://community.akamai.steamstatic.com/economy/image/' + item.icon_url;
                        img.alt = item.name;
                        img.loading = 'lazy';
                        const nameDiv = document.createElement('div');
                        nameDiv.textContent = item.name;
                        itemDiv.appendChild(img);
                        itemDiv.appendChild(nameDiv);
                        itemsDiv.appendChild(itemDiv);
                    });
                    card.appendChild(itemsDiv);

                    list.appendChild(card);
                });
            } else {
                list.innerHTML = '<div style="color: #888;">Пока нет объявлений.</div>';
            }
        }

        function deleteOffer(offerId) {
            if (!confirm('Удалить это объявление?')) return;
            fetch('/api/offers/' + offerId, { method: 'DELETE' })
                .then(r => r.json())
                .then(data => {
                    if (data.error) {
                        alert('Ошибка: ' + data.error);
                        return;
                    }
                    loadOffers();
                })
                .catch(err => alert('Ошибка сети: ' + err));
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Инициализация: сначала авторизация, затем загрузка объявлений
        checkAuth()
            .then(() => loadOffers())
            .catch(() => loadOffers()); // даже если ошибка, пробуем загрузить объявления
    </script>
</body>
</html>

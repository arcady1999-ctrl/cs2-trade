<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS2 Trade — Обмен скинами</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #1b1b1b;
            color: #fff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            background: #111;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #f0c040;
        }
        nav {
            display: flex;
            gap: 20px;
        }
        nav a {
            color: #ccc;
            text-decoration: none;
            font-size: 16px;
        }
        nav a:hover {
            color: #fff;
        }
        .btn-steam {
            background: #2a475e;
            color: #fff;
            border: none;
            padding: 10px 18px;
            font-size: 15px;
            cursor: pointer;
            border-radius: 4px;
            text-decoration: none;
            display: inline-block;
        }
        .btn-steam:hover {
            background: #1b2838;
        }
        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 20px;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 20px;
            text-align: center;
        }
        .intro {
            color: #aaa;
            text-align: center;
            margin-bottom: 40px;
        }
        .trades-placeholder {
            width: 100%;
            max-width: 800px;
            background: #242424;
            border-radius: 8px;
            padding: 30px;
            text-align: center;
            color: #777;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">CS2 Trade</div>
        <nav>
            <a href="#">Главная</a>
            <a href="#">Мои обмены</a>
            <a href="#">О проекте</a>
        </nav>
        <a class="btn-steam" id="auth-button" href="/auth/steam">Войти через Steam</a>
    </header>
    <div class="container">
        <h1>Обменивайся скинами CS2 напрямую</h1>
        <p class="intro">Без посредников и платёжных систем. Только ты и твой трейд-партнёр.</p>
        <div class="trades-placeholder">
            Здесь скоро появятся объявления об обменах
        </div>
    </div>
    <script>
        // Проверяем статус входа при загрузке страницы
        fetch('/api/user')
            .then(response => response.json())
            .then(data => {
                const authButton = document.getElementById('auth-button');
                if (data.steamId) {
                    // Пользователь вошёл
                    authButton.textContent = 'Привет, ' + data.steamId + ' (Выйти)';
                    authButton.href = '/logout';
                } else {
                    // Не вошёл
                    authButton.textContent = 'Войти через Steam';
                    authButton.href = '/auth/steam';
                }
            })
            .catch(err => console.error('Ошибка получения статуса:', err));
    </script>
</body>
</html>

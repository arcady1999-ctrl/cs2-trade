<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Настройки — CS2 Trade</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #1b1b1b;
            color: #fff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            background: #111;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #f0c040;
        }
        nav a {
            color: #ccc;
            text-decoration: none;
            margin-left: 20px;
        }
        nav a:hover { color: #fff; }
        .btn-steam {
            background: #2a475e;
            color: #fff;
            padding: 10px 18px;
            border-radius: 4px;
            text-decoration: none;
            font-size: 15px;
        }
        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 20px;
        }
        h2 {
            margin-bottom: 20px;
        }
        form {
            background: #242424;
            padding: 30px;
            border-radius: 8px;
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        label {
            font-size: 16px;
        }
        input[type="text"] {
            padding: 10px;
            font-size: 16px;
            border-radius: 4px;
            border: 1px solid #444;
            background: #1b1b1b;
            color: #fff;
        }
        button {
            padding: 12px;
            background: #2a475e;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background: #1b2838;
        }
        .success {
            color: #4caf50;
            margin-bottom: 15px;
        }
        .back-link {
            color: #aaa;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">CS2 Trade</div>
        <nav>
            <a href="/">Главная</a>
            <a href="/settings">Настройки</a>
            <a class="btn-steam" id="auth-button" href="/auth/steam">Войти через Steam</a>
        </nav>
    </header>
    <div class="container">
        <h2>Введите ваш Steam API-ключ</h2>
        <div id="message"></div>
        <form action="/settings" method="POST">
            <label for="apiKey">Steam API Key</label>
            <input type="text" id="apiKey" name="apiKey" placeholder="Например: 5F3A...">
            <button type="submit">Сохранить</button>
        </form>
        <p><a class="back-link" href="/">← На главную</a></p>
    </div>
    <script>
        // Отображаем сообщение, если ключ был сохранён
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('saved')) {
            document.getElementById('message').innerHTML = '<div class="success">Ключ сохранён!</div>';
        }
        // Обновляем кнопку входа
        fetch('/api/user')
            .then(r => r.json())
            .then(data => {
                const btn = document.getElementById('auth-button');
                if (data.steamId) {
                    btn.textContent = 'Привет, ' + data.steamId + ' (Выйти)';
                    btn.href = '/logout';
                } else {
                    btn.textContent = 'Войти через Steam';
                    btn.href = '/auth/steam';
                }
            });
    </script>
</body>
</html>
